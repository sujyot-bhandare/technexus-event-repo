<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weathervane — Live Sky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="sky-canvas"></canvas>
<div id="lightning-flash"></div>

<div class="app">
  <div class="topbar">
    <div class="wordmark">Weather<span>vane</span></div>
    <div class="top-controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="city-input" type="text" placeholder="Search a city…" autocomplete="off">
      </div>
      <div class="unit-toggle">
        <button id="unit-c" class="active">°C</button>
        <button id="unit-f">°F</button>
      </div>
      <button class="icon-btn" id="locate-btn" title="Use my location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="main-area">
    <div class="panel" id="panel">
      <div class="status-line" id="status-line">Loading sky…</div>

      <div class="place-row">
        <div>
          <div class="place-name" id="place-name">—</div>
          <div class="condition-desc" id="condition-desc">—</div>
        </div>
        <div class="place-date" id="place-date"></div>
      </div>

      <div class="temp-row">
        <div class="temp-big" id="temp-big">—<sup>°</sup></div>
        <img class="weather-icon" id="weather-icon" src="" alt="" style="display:none;">
      </div>

      <div class="sub-stats">
        <span>Feels like <b id="feels-like">—</b></span>
        <span>H <b id="temp-high">—</b> · L <b id="temp-low">—</b></span>
      </div>

      <div class="stat-grid">
        <div class="stat-tile">
          <div class="label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2s6 7 6 11a6 6 0 1 1-12 0c0-4 6-11 6-11z"/>
            </svg> Humidity
          </div>
          <div class="value" id="stat-humidity">—</div>
        </div>
        <div class="stat-tile">
          <div class="label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 8h11a3 3 0 1 0-3-3M3 16h15a3 3 0 1 1-3 3M3 12h8"/>
            </svg> Wind
          </div>
          <div class="value" id="stat-wind">—</div>
        </div>
        <div class="stat-tile">
          <div class="label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v10l6 4"/>
              <circle cx="12" cy="12" r="10"/>
            </svg> Pressure
          </div>
          <div class="value" id="stat-pressure">—</div>
        </div>
        <div class="stat-tile">
          <div class="label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 21h14M12 3v11m0 0l-4-4m4 4l4-4"/>
            </svg> Sunset
          </div>
          <div class="value" id="stat-sunset">—</div>
        </div>
      </div>

      <div class="section-label">Next hours</div>
      <div class="hourly-scroll" id="hourly-scroll">
        <div class="empty-hint">Search a city to see the forecast.</div>
      </div>

      <div class="section-label">5-day outlook</div>
      <div class="daily-list" id="daily-list"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="script.js"></script>
</body>
</html>
